<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mason Nguyen | Mechanical Engineering Student</title>
<meta name="description" content="Mechanical engineering portfolio: projects, skills, and contact.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef0ea; --grid:#d3d9d0; --ink:#17232b; --muted:#56646b; --accent:#1f6f78; --sheet:#f7f8f4;
  --head:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; font:400 1.0625rem/1.65 var(--body);
}
a{color:var(--accent)} a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--head);font-weight:600;line-height:1.05;margin:0}
nav{display:flex;gap:24px;justify-content:flex-end;padding:20px 0;font:600 1.1rem var(--head);letter-spacing:.04em}
nav a{color:var(--ink);text-decoration:none;border-bottom:2px solid transparent}
nav a:hover{border-color:var(--accent)}

/* Hero: a dimensioned part label */
.hero{padding:40px 0 72px}
.dim{display:flex;align-items:center;gap:10px;color:var(--accent);font:600 .95rem var(--head);letter-spacing:.06em;max-width:760px}
.dim::before,.dim::after{content:"";height:2px;flex:1;background:var(--accent)}
.dim span{white-space:nowrap}
.hero h1{font-size:clamp(3.4rem,11vw,7.5rem);font-weight:700;letter-spacing:-.01em;margin:14px 0 6px}
.hero .role{font:500 clamp(1.3rem,3vw,1.8rem) var(--head);color:var(--accent);margin:0 0 18px}
.hero p.lead{max-width:56ch;margin:0 0 26px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:10px 20px;border:2px solid var(--ink);color:var(--ink);text-decoration:none;font:600 1.05rem var(--head);letter-spacing:.04em;background:var(--sheet)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}

section{padding:40px 0 56px}
section>.wrap>h2{font-size:2.4rem;margin-bottom:6px}
.sub{color:var(--muted);margin:0 0 28px;max-width:60ch}

/* Projects: drawing sheets with title blocks */
.sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:28px}
.sheet{background:var(--sheet);border:2px solid var(--ink);display:flex;flex-direction:column}
.fig{aspect-ratio:16/10;border-bottom:2px solid var(--ink);background:
  linear-gradient(45deg,transparent 49.6%,var(--grid) 49.6%,var(--grid) 50.4%,transparent 50.4%),
  linear-gradient(-45deg,transparent 49.6%,var(--grid) 49.6%,var(--grid) 50.4%,transparent 50.4%);
  display:grid;place-items:center;color:var(--muted);font:600 1rem var(--head);letter-spacing:.05em;overflow:hidden}
.fig img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:18px 20px 8px}
.body h3{font-size:1.7rem;margin-bottom:8px}
.body p{margin:0 0 14px}
.tb{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink);margin-top:auto}
.tb div{padding:8px 20px;border-bottom:1px solid var(--grid);font-size:.95rem}
.tb div:nth-child(odd){border-right:1px solid var(--grid)}
.tb b{display:block;font:600 .9rem var(--head);color:var(--muted);letter-spacing:.04em}
.links{display:flex;gap:18px;padding:12px 20px 16px;border-top:2px solid var(--ink);font:600 1.05rem var(--head);letter-spacing:.04em}

/* Skills: bill of materials */
.bom{width:100%;border-collapse:collapse;background:var(--sheet);border:2px solid var(--ink)}
.bom th,.bom td{text-align:left;padding:10px 16px;border-bottom:1px solid var(--grid);vertical-align:top}
.bom thead th{font:600 1.05rem var(--head);letter-spacing:.05em;background:var(--ink);color:var(--paper);border:0}
.bom td:first-child{font:600 1.1rem var(--head);width:26%;white-space:nowrap}
.bom td:nth-child(2){color:var(--muted);width:20%}
.tbl{overflow-x:auto}

.courses{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));border-top:2px solid var(--ink);border-left:2px solid var(--ink);background:var(--sheet)}
.courses li{padding:12px 16px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);font:600 1.2rem/1.2 var(--head);letter-spacing:.02em}
.contact p{max-width:52ch;margin:0 0 20px}
footer{padding:28px 0 48px;color:var(--muted);font-size:.95rem;border-top:2px solid var(--ink)}
@media (prefers-color-scheme:dark){
  :root{--paper:#121b21;--grid:#223039;--ink:#e6ebe6;--muted:#9aa9ae;--accent:#5cc0c9;--sheet:#182329}
  .btn.primary,.bom thead th{color:#121b21}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media (max-width:560px){.tb{grid-template-columns:1fr}.tb div:nth-child(odd){border-right:0}nav{justify-content:flex-start;flex-wrap:wrap}}

.fig.has{background:var(--sheet);position:relative}
.fig.has img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;padding:10px 20px 0}
.thumbs button{padding:0;width:72px;height:48px;border:2px solid var(--grid);background:var(--sheet);cursor:pointer}
.thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
nav a[aria-current="page"]{border-color:var(--ink)}
.pagehead{padding:24px 0 8px}
.pagehead .who{font:500 1.4rem var(--head);color:var(--accent);margin:0 0 6px}
.pagehead h1{font-size:clamp(2.6rem,8vw,4.5rem);font-weight:700}
footer a{color:var(--muted)}
</style>
</head>
<body>
<header class="wrap"><nav aria-label="Main"><a href="index.html" aria-current="page">Projects</a><a href="skills.html">Skills and Coursework</a><a href="skills.html#contact">Contact</a></nav></header>
<main>
  <div class="wrap hero">
    <div class="dim" aria-hidden="true"><span id="dimText"></span></div>
    <h1 id="name"></h1>
    <p class="role" id="role"></p>
    <p class="lead" id="lead"></p>
    <div class="btns" id="heroLinks"></div>
  </div>
  <section id="projects"><div class="wrap">
    <h2>Projects</h2>
    <p class="sub">Selected work, from first sketch to finished build.</p>
    <div class="sheets" id="sheets"></div>
  </div></section>
</main>
<footer><div class="wrap"><span id="foot"></span> &middot; <a id="footMail"></a></div></footer>
<script>
/* ========== EDIT THIS BLOCK ONLY ========== */
const profile = {
  name: "Mason Nguyen",
  role: "Mechanical Engineering Student, Texas A&M",
  lead: "Looking for internships and co-ops in power generation, heat exchangers, and rotating equipment.",
  dimension: "MECHANICAL ENGINEERING PORTFOLIO  |  TEXAS A&M  |  CLASS OF 2029",
  email: "masonmnguyen@tamu.edu",
  linkedin: "https://www.linkedin.com/in/mason-nguyen12/",                                 // add your LinkedIn link, or leave empty to hide
  resume: "Mason_Nguyen_Resume.pdf"             // upload this file next to index.html
};

/* images: [["file path", "short description"], ...]  The first one is shown large. */
const projects = [
  {
    title: "NASA Micro G NeXT: Cable Management Device",
    summary: "Proposed a device that helps astronauts deploy and retrieve a power transfer cable while keeping regolith and dust out. Started with hand sketches and simple mechanism analysis in SolidWorks, and now building the final model and running FEA.",
    images: [],
    tools: "Mechanical Design, SolidWorks, FEA",
    role: "Mechanical Team Lead",
    year: "September 2026 to Present",
    status: "In Progress",
    repo: "",
    report: ""
  },
  {
    title: "ASME Go Kart",
    summary: "Team design of a go-kart to finish a curvy course at a 30 mph top speed. I hand sketched the frame in 3-view and isometric, modeled the steering wheel and shaft in SolidWorks for FEA, and helped weld and assemble the kart. Aligning the caliper with the rotor and enlarging the rotor increased brake efficiency by 10%.",
    images: [
      ["images/kart-final.jpg", "Finished go-kart, side view"],
      ["images/kart-cad.jpg", "CAD model of the go-kart"],
    ],
    tools: "SolidWorks, FEA, welding, power tools",
    role: "Team Member",
    year: " September 2025 to April 2026",
    status: "Built",
    repo: "",
    report: ""
  },
  {
    title: "Tennis Ball Machine",
    summary: "Designed and built a ball machine from salvaged plywood and brackets. I aligned the feeding chute with the wheels for reliable firing, soldered the motor wires into a parallel circuit with a manual switch, and fixed low motor rpm by switching to a leaf blower battery.",
    images: [
      ["images/tennis-side.jpg", "Tennis ball machine with feed hose, side view"],
      ["images/tennis-front.jpg", "Tennis ball machine, view of the two drive wheels"]
    ],
    tools: "Hand sketching, soldering, salvaged materials",
    role: "Lead Engineer",
    year: "2025",
    status: "Built",
    repo: "",
    report: ""
  }
];
/* ========== END EDIT BLOCK ========== */

const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, text = "") => {
  const n = document.createElement(tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  n.textContent = text; return n;
};
function linkBtn(parent, text, href, primary, external) {
  if (!href) return;
  const a = el("a", { class: "btn" + (primary ? " primary" : ""), href }, text);
  if (external) { a.target = "_blank"; a.rel = "noopener"; }
  parent.appendChild(a);
}

document.title = profile.name + " | " + profile.role;
$("dimText").textContent = profile.dimension;
$("name").textContent = profile.name;
$("role").textContent = profile.role;
$("lead").textContent = profile.lead;
$("foot").textContent = "\u00a9 " + new Date().getFullYear() + " " + profile.name;
$("footMail").textContent = profile.email; $("footMail").href = "mailto:" + profile.email;

const hb = $("heroLinks");
linkBtn(hb, "View projects", "#projects", true, false);
linkBtn(hb, "Skills and coursework", "skills.html", false, false);
linkBtn(hb, "GitHub", profile.github, false, true);
linkBtn(hb, "LinkedIn", profile.linkedin, false, true);
linkBtn(hb, "Resume (PDF)", profile.resume, false, true);

projects.forEach(p => {
  const s = el("article", { class: "sheet" });
  const imgs = p.images || [];
  const fig = el("div", { class: "fig" + (imgs.length ? " has" : "") });
  let main = null;
  if (imgs.length) { main = el("img", { src: imgs[0][0], alt: imgs[0][1] }); fig.appendChild(main); }
  else fig.textContent = "ADD RENDER OR PHOTO";
  const parts = [fig];
  if (imgs.length > 1) {
    const th = el("div", { class: "thumbs" });
    imgs.forEach((im, k) => {
      const b = el("button", { type: "button", "aria-label": "Show photo: " + im[1], "aria-pressed": k === 0 ? "true" : "false" });
      b.appendChild(el("img", { src: im[0], alt: "", loading: "lazy" }));
      b.onclick = () => {
        main.src = im[0]; main.alt = im[1];
        th.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
      };
      th.appendChild(b);
    });
    parts.push(th);
  }
  const body = el("div", { class: "body" });
  body.appendChild(el("h3", {}, p.title));
  body.appendChild(el("p", {}, p.summary));
  const tb = el("div", { class: "tb" });
  [["Tools", p.tools], ["Role", p.role], ["Year", p.year], ["Status", p.status]].forEach(([k, v]) => {
    const d = el("div"); d.appendChild(el("b", {}, k)); d.appendChild(document.createTextNode(v)); tb.appendChild(d);
  });
  const links = el("div", { class: "links" });
  if (p.repo) links.appendChild(el("a", { href: p.repo, target: "_blank", rel: "noopener" }, "Repository"));
  if (p.report) links.appendChild(el("a", { href: p.report, target: "_blank", rel: "noopener" }, "Report"));
  s.append(...parts, body, tb);
  if (links.children.length) s.appendChild(links);
  $("sheets").appendChild(s);
});
</script>
</body>
</html>
